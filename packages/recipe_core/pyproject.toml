[tool.poetry]
name = "recipe-core"
version = "0.1.1"
description = "Core recipe KBZhU calculator domain logic library"
authors = ["Alabaykin <bells.vtv@gmail.com>"]
readme = "README.md"
repository = "https://github.com/Alabaykin/Nutritional-Calculator"
homepage = "https://github.com/Alabaykin/Nutritional-Calculator"
keywords = ["recipe", "kbzhu", "nutrition", "calculator", "diet", "pydantic"]
packages = [{include = "recipe_core", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
