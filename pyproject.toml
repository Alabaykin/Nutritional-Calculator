[tool.poetry]
name = "recipe-calculator-app"
version = "0.1.0"
description = "FastAPI and CLI application for recipe KBZhU calculations"
authors = ["Student <student@isu.ru>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
httpx = "^0.27.0"
recipe-core = {path = "packages/recipe_core", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pluggy = "^1.5.0"
httpx = "^0.27.0"
sphinx = "^7.2.6"
myst-parser = "^2.0.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
